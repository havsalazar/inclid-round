    <rect x="10.2" y="1" width="3.6" height="5" rx="0.8" transform="rotate(45 12 12)"/>
    <rect x="10.2" y="1" width="3.6" height="5" rx="0.8" transform="rotate(90 12 12)"/>
    <rect x="10.2" y="1" width="3.6" height="5" rx="0.8" transform="rotate(135 12 12)"/>
    <rect x="10.2" y="1" width="3.6" height="5" rx="0.8" transform="rotate(180 12 12)"/>
    <rect x="10.2" y="1" width="3.6" height="5" rx="0.8" transform="rotate(225 12 12)"/>
    <rect x="10.2" y="1" width="3.6" height="5" rx="0.8" transform="rotate(270 12 12)"/>
